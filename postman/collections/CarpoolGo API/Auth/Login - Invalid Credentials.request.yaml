$kind: http-request
name: Login - Invalid Credentials
method: POST
url: '{{baseUrl}}/api/auth/login'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "wrong@example.com",
      "password": "wrongpassword"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Test 1: Status code is 401 for invalid credentials
      pm.test("Status code is 401 for invalid credentials", function () {
          pm.response.to.have.status(401);
      });

      // Test 2: No token returned
      pm.test("No token returned on failed login", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("token");
      });

      // Test 3: Error message present
      pm.test("Error message is present", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("error");
      });
